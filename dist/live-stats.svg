name: Live Stats Update

on:
  schedule:
    - cron: "*/1 * * * *"   # runs every 1 minutes
  workflow_dispatch: {}     # lets you trigger it manually from the Actions tab

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate live stats SVG
        env:
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN }}
          GH_USERNAME: shujahhhub
        run: node scripts/generate-stats.js

      - name: Commit and push if the stats changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/live-stats.svg
          if git diff --staged --quiet; then
            echo "No change in stats, skipping commit."
          else
            git commit -m "chore: refresh live stats"
            git pull --rebase origin main
            git push
          fi
