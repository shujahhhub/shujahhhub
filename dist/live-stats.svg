<svg width="700" height="210" viewBox="0 0 700 210" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowSoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00fff0"/>
      <stop offset="50%" stop-color="#ff00e5"/>
      <stop offset="100%" stop-color="#00fff0"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1a2a3a" stroke-width="0.6"/>
    </pattern>
  </defs>

  <rect x="1" y="1" width="698" height="208" rx="10" fill="#03050d"/>
  <rect x="1" y="1" width="698" height="208" rx="10" fill="url(#grid)"/>
  <rect x="1.5" y="1.5" width="697" height="207" rx="10" fill="none" stroke="url(#borderGrad)" stroke-width="2" filter="url(#glowSoft)"/>

  <!-- Total Contributions -->
  <text x="175" y="82" text-anchor="middle" font-family="'Consolas', 'Courier New', monospace" font-size="36" font-weight="800" fill="#00fff0" filter="url(#glow)">164</text>
  <text x="175" y="112" text-anchor="middle" font-family="'Consolas', 'Courier New', monospace" font-size="13" letter-spacing="1.5" fill="#5be9ff">TOTAL CONTRIBUTIONS</text>
  <text x="175" y="135" text-anchor="middle" font-family="'Consolas', 'Courier New', monospace" font-size="11" fill="#39ff8f">Nov 22, 2025 - Present</text>

  <!-- Current Streak -->
  <circle cx="350" cy="76" r="42" fill="none" stroke="#ff00e5" stroke-width="3.5" filter="url(#glow)"/>
  <text x="350" y="87" text-anchor="middle" font-family="'Consolas', 'Courier New', monospace" font-size="30" font-weight="800" fill="#ff5df0" filter="url(#glow)">4</text>
  <text x="350" y="140" text-anchor="middle" font-family="'Consolas', 'Courier New', monospace" font-size="13" font-weight="700" letter-spacing="1.5" fill="#ff5df0">CURRENT STREAK</text>
  <text x="350" y="160" text-anchor="middle" font-family="'Consolas', 'Courier New', monospace" font-size="11" fill="#39ff8f">Jul 10, 2026 - Jul 13, 2026</text>

  <!-- Longest Streak -->
  <text x="525" y="82" text-anchor="middle" font-family="'Consolas', 'Courier New', monospace" font-size="36" font-weight="800" fill="#00fff0" filter="url(#glow)">8</text>
  <text x="525" y="112" text-anchor="middle" font-family="'Consolas', 'Courier New', monospace" font-size="13" letter-spacing="1.5" fill="#5be9ff">LONGEST STREAK</text>
  <text x="525" y="135" text-anchor="middle" font-family="'Consolas', 'Courier New', monospace" font-size="11" fill="#39ff8f">Nov 22, 2025 - Nov 29, 2025</text>
</svg>